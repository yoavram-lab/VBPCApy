site_name: VBPCApy
site_description: Variational Bayesian PCA with missing data support
site_url: https://yoavram-lab.github.io/VBPCApy
repo_url: https://github.com/yoavram-lab/VBPCApy
repo_name: yoavram-lab/VBPCApy

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            docstring_style: google
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true

not_in_nav: |
  IMPLEMENTATION_PLAN.md

hooks:
  - scripts/docs_gallery_hook.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - Tutorials:
    - Basic Dense PCA: tutorials/basic-dense-pca.md
    - Missing Data & Model Selection: tutorials/missing-data-model-selection.md
    - Preprocessing Mixed Data: tutorials/preprocessing-mixed-data.md
    - Missing-aware Pipeline: tutorials/missing-aware-pipeline.md
    - Mixed Missing Table Notebook: https://github.com/yoavram-lab/VBPCApy/blob/main/examples/mixed-missing-table.ipynb
    - Genomics Dosage Data: tutorials/genomics-dosage.md
    - Sparse Data Workflows: tutorials/sparse-data.md
    - Cross-Validation & Diagnostics: tutorials/cv-diagnostics.md
  - How-To Guides:
    - Compatibility Modes: howto/compatibility-modes.md
    - Convergence Tuning: howto/convergence.md
    - Runtime & Threading: howto/runtime-tuning.md
    - Numerical Validation: howto/numerical-validation.md
    - Plotting: howto/plotting.md
  - Example Gallery:
    - Overview: gallery/index.md
    - Missing Dense Observations: gallery/dense/index.md
    - Sparse Observations: gallery/sparse/index.md
    - Mixed-data Pipeline: gallery/pipeline/index.md
    - Cost versus Probe RMS: gallery/selection/index.md
    - Original-variable Cell Validation: gallery/raw-cv/index.md
    - Plotting Utilities: gallery/plots/index.md
  - Concepts:
    - Algorithm Overview: concepts/algorithm.md
    - Data Convention: concepts/data-convention.md
    - Convergence Criteria: concepts/convergence.md
    - Model Selection: concepts/model-selection.md
  - API Reference:
    - VBPCA: api/vbpca.md
    - 0.5 migration: api/migration-05.md
    - Solver Options: api/options.md
    - Fit Results: api/results.md
    - Model Selection: api/model-selection.md
    - Preprocessing: api/preprocessing.md
    - Utilities: api/utilities.md
    - Plotting: api/plotting.md
  - Limitations: limitations.md
  - Changelog: changelog.md
  - Release Validation:
    - 0.5.0: releases/0.5.0.md
    - 0.4.12: releases/0.4.12.md
    - 0.4.11: releases/0.4.11.md
    - 0.4.7: releases/0.4.7.md
    - 0.4.6: releases/0.4.6.md
  - Citation: citation.md
