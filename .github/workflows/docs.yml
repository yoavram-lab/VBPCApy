name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/vbpca_py/**"
      - "scripts/*gallery*.py"
      - "scripts/check_public_examples.py"
      - "scripts/example_masked_pipeline.py"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install Eigen
        run: sudo apt-get install -y libeigen3-dev
      - name: Sync environment
        run: uv sync --extra docs --extra plot --extra data --extra polars
      - name: Install the documentation wheel
        run: |
          uv build --wheel --out-dir dist-docs
          uv pip install --reinstall --no-deps dist-docs/*.whl
      - name: Execute actual public API and migration sources
        run: .venv/bin/python scripts/check_public_examples.py --require-wheel
      - name: Build docs
        run: |
          .venv/bin/python -m mkdocs build --strict
          .venv/bin/python scripts/check_gallery_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
