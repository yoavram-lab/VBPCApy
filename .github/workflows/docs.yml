name: Deploy docs

# Versioned documentation built with mike. Each build is committed to the
# gh-pages branch, which accumulates every published version; the branch
# contents are then deployed to GitHub Pages.
#
#   push to main          -> "dev"
#   published release     -> dispatches this workflow on main for the release
#                            tag as "<major>.<minor>", updating the "latest"
#                            alias (pre-releases do not move "latest")
#   workflow_dispatch     -> any ref, version label and optional alias, also
#                            used to backfill earlier releases (v0.4.12 as 0.4)
#
# The github-pages environment deploys from main only, so a release run
# dispatches the build rather than deploying from the tag itself.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "overrides/**"
      - ".github/pages/**"
      - "tests/test_markdown_examples.py"
      - "tests/test_notebook_examples.py"
      - "mkdocs.yml"
      - "src/vbpca_py/**"
      - "scripts/*gallery*.py"
      - "scripts/check_public_examples.py"
      - "scripts/example_masked_pipeline.py"
      - "README.md"
      - "MANIFEST.in"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit whose documentation is built
        required: true
        default: main
      version:
        description: Version label, for example 0.4 or dev
        required: true
        default: dev
      alias:
        description: Alias to point at this version (empty or latest)
        required: false
        default: ""

permissions:
  contents: write   # mike commits each build to the gh-pages branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NO_MKDOCS_2_WARNING: "1"

jobs:
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Build the release documentation through the main-branch workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          version="$(echo "${TAG#v}" | cut -d. -f1,2)"
          if [ "$PRERELEASE" = true ]; then alias=""; else alias=latest; fi
          gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f ref="$TAG" -f version="$version" -f alias="$alias"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the documented ref and version label
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ALIAS: ${{ inputs.alias }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)
              ref="$GITHUB_SHA"; version=dev; alias="" ;;
            workflow_dispatch)
              ref="$INPUT_REF"; version="$INPUT_VERSION"; alias="$INPUT_ALIAS" ;;
            *)
              echo "unsupported event: $EVENT"; exit 1 ;;
          esac
          if ! [[ "$version" =~ ^([0-9]+\.[0-9]+|dev)$ ]]; then
            echo "::error::Version label must be major.minor or dev, not '$version'"
            exit 1
          fi
          if [ -n "$alias" ] && [ "$alias" != latest ]; then
            echo "::error::Alias must be empty or latest, not '$alias'"
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "version=$version"
            echo "alias=$alias"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the documented source
        env:
          REF: ${{ steps.version.outputs.ref }}
        run: git worktree add --detach docs-src "$REF"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install Eigen
        run: sudo apt-get install -y libeigen3-dev

      - name: Sync the documentation environment
        working-directory: docs-src
        run: |
          set -euo pipefail
          extras=(--extra docs)
          for extra in plot data polars; do
            if grep -q "^$extra = \[" pyproject.toml; then
              extras+=(--extra "$extra")
            fi
          done
          uv sync "${extras[@]}"
          uv pip install "mike==2.2.0"

      # Releases from 0.5 onwards execute their examples before publishing.
      # Earlier refs (backfilled documentation) are rendered as they were.
      - name: Execute public API examples and the strict site build
        if: hashFiles('docs-src/scripts/check_public_examples.py') != ''
        working-directory: docs-src
        run: |
          set -euo pipefail
          uv build --wheel --out-dir dist-docs
          uv pip install --reinstall --no-deps dist-docs/*.whl
          .venv/bin/python scripts/check_public_examples.py --require-wheel
          .venv/bin/python -m mkdocs build --strict
          .venv/bin/python scripts/check_gallery_site.py
          .venv/bin/python -m pytest -q \
            tests/test_markdown_examples.py tests/test_notebook_examples.py

      - name: Enable the version selector and banner for refs that predate them
        working-directory: docs-src
        run: |
          set -euo pipefail
          if ! grep -q "provider: mike" mkdocs.yml; then
            if grep -q "^extra:" mkdocs.yml; then
              echo "::error::mkdocs.yml has an extra block without a mike version provider"
              exit 1
            fi
            printf '\nextra:\n  version:\n    provider: mike\n    default: latest\n' >> mkdocs.yml
          fi
          if ! grep -q "custom_dir:" mkdocs.yml; then
            cp -R "$GITHUB_WORKSPACE/overrides" overrides
            sed -i 's/^theme:$/theme:\n  custom_dir: overrides/' mkdocs.yml
            grep -q "custom_dir: overrides" mkdocs.yml
          fi

      - name: Commit this version to gh-pages
        working-directory: docs-src
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ALIAS: ${{ steps.version.outputs.alias }}
        run: |
          set -euo pipefail
          # mike runs the mkdocs executable from PATH.
          export PATH="$PWD/.venv/bin:$PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || echo "gh-pages does not exist yet"
          if [ -n "$ALIAS" ]; then
            mike deploy --push --update-aliases "$VERSION" "$ALIAS"
            mike set-default --push "$ALIAS"
          else
            mike deploy --push "$VERSION"
          fi
          # Until a release has been published under the versioned site, also
          # publish this build as its release line (for example 0.5) and point
          # latest at it, so the site root and redirected links resolve.
          if ! mike list --json | grep -q '"latest"'; then
            line="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/^version = "([0-9]+\.[0-9]+).*/\1/')"
            if ! [[ "$line" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Cannot determine the release line from pyproject.toml"
              exit 1
            fi
            echo "No latest version yet; publishing this build as $line (latest)"
            mike deploy --push --update-aliases "$line" latest
            mike set-default --push latest
          fi

      - name: Assemble the Pages site from gh-pages
        run: |
          set -euo pipefail
          mkdir gh-pages-tree
          git archive gh-pages | tar -x -C gh-pages-tree
          # Copy alias symlinks (for example latest -> 0.5) as real directories.
          cp -RL gh-pages-tree pages
          cp .github/pages/404.html pages/404.html
          test -f pages/versions.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
