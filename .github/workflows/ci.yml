name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      octave: ${{ steps.filter.outputs.octave }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            octave:
              - 'src/vbpca_py/_full_update.py'
              - 'src/vbpca_py/_rotate.py'
              - 'src/vbpca_py/_remove_empty.py'
              - 'src/vbpca_py/_monitoring.py'
              - 'src/vbpca_py/rotate_update_kernels.cpp'
              - 'src/vbpca_py/_rms.py'
              - 'src/vbpca_py/_mean.py'
              - 'src/vbpca_py/_cost.py'
              - 'src/vbpca_py/_sparse_error.py'
              - 'tests/test_rotate.py'
              - 'tests/test_rank_zero_rotation.py'
              - 'tests/test_rms_regression.py'
              - 'tests/test_mean.py'
              - 'tests/test_cost.py'
              - 'tests/test_octave_parity_smoke.py'
              - 'tests/test_octave_execution.py'
              - 'tests/test_octave_reference_algorithms.py'
              - 'tools/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install Eigen
        run: sudo apt-get install -y libeigen3-dev
      - name: Sync environment
        run: uv sync --extra dev --extra plot
      - name: Format check
        run: uv run ruff format --preview --check src tests scripts analysis
      - name: Lint
        run: uv run ruff check --preview src tests scripts analysis
      - name: Type check (strict)
        run: uv run mypy --strict src tests/typing_results.py
      - name: Release metadata check
        run: uv run python scripts/check_release_metadata.py
      - name: Source archive test collection
        run: |
          uv build --sdist --out-dir dist-source-check
          uv run python scripts/check_sdist_tests.py dist-source-check

  numpy24-typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install Eigen
        run: sudo apt-get install -y libeigen3-dev
      - name: Sync typing environment
        run: uv sync --extra dev --extra plot --python 3.12
      - name: Match the NumPy 2.4 wheel typing environment
        run: uv pip install 'numpy==2.4.6' 'scipy==1.17.1' 'scipy-stubs==1.17.1.5' 'mypy==2.4.0'
      - name: Check source and consumers for supported platforms
        run: |
          for platform in linux darwin win32; do
            .venv/bin/python -m mypy --strict --platform "$platform" \
              --cache-dir ".mypy_cache/numpy24-$platform" src tests/typing_results.py
          done

  replay-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install Eigen
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip" -OutFile eigen.zip
          Expand-Archive eigen.zip -DestinationPath C:\eigen
          echo "EIGEN_INCLUDE_DIR=C:\eigen\eigen-3.4.0" >> $env:GITHUB_ENV
      - name: Sync environment
        run: uv sync --extra dev --extra plot --python 3.12
      - name: Replay and stopping-option regressions
        run: uv run pytest -q tests/test_convergence_replay.py tests/test_unavailable_slowing_down.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install Eigen
        run: sudo apt-get install -y libeigen3-dev
      - name: Sync environment
        run: uv sync --extra dev --extra plot --python ${{ matrix.python-version }}
      - name: Run tests with coverage
        run: >-
          uv run pytest -q
          --cov=src/vbpca_py
          --cov-report=term-missing
          --cov-fail-under=89

  sklearn-compat:
    name: sklearn (${{ matrix.sklearn-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sklearn-version: ["1.8.0", "1.9.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install Eigen
        run: sudo apt-get install -y libeigen3-dev
      - name: Sync environment
        run: uv sync --extra dev --extra plot --python 3.12
      - name: Install the supported sklearn version
        run: uv pip install "scikit-learn==${{ matrix.sklearn-version }}"
      - name: Native estimator and parameter contracts
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_native_estimator.py tests/test_configuration.py
          tests/test_sklearn_compat.py tests/test_probe_coverage.py
          tests/test_preprocessor_state.py

  numerical-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install Eigen
        run: sudo apt-get install -y libeigen3-dev
      - name: Build package and native reference helpers
        run: uv sync --extra dev --extra plot --python 3.12
      - name: Required numerical references
        run: uv run --extra dev python scripts/check_numerical_reference.py
      - name: Sparse native allocation contract (Linux/glibc)
        run: uv run --extra dev python scripts/check_sparse_allocations.py

  octave-parity:
    needs: changes
    if: needs.changes.outputs.octave == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev octave octave-dev
      - name: Sync environment
        run: uv sync --extra dev --extra plot --extra octave
      - name: Build MEX helpers
        run: |
          cd tools
          mkoctfile --mex -O -DNOTHREADS -o errpca_pt errpca_pt.cpp || true
          mkoctfile --mex -O -o subtract_mu subtract_mu.cpp || true
      - name: Run Octave parity tests
        run: uv run pytest -q -m octave
